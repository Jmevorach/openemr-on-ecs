name: CDK Configuration Matrix Testing

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  PIP_VERSION: "26.2"

jobs:
  config-matrix-test:
    name: Test CDK Configurations
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          pip install -r requirements.txt

      - name: Install pinned Node.js tools
        run: |
          npm ci

      - name: Run comprehensive configuration matrix tests
        env:
          AWS_ACCESS_KEY_ID: "fake"
          AWS_SECRET_ACCESS_KEY: "fake"
          AWS_DEFAULT_REGION: "us-west-2"
          CDK_DEFAULT_REGION: "us-west-2"
        run: |
          echo "Testing all CDK configuration combinations..."
          python3 scripts/test-cdk-synthesis.py --verbose

      - name: Run original stress test
        env:
          AWS_ACCESS_KEY_ID: "fake"
          AWS_SECRET_ACCESS_KEY: "fake"
          AWS_DEFAULT_REGION: "us-west-2"
          CDK_DEFAULT_REGION: "us-west-2"
        run: |
          echo "Running bash stress test script..."
          bash scripts/stress-test.sh

      - name: Upload synthesis artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdk-synth-logs
          path: /tmp/cdk-synth-*.log
          if-no-files-found: ignore
          retention-days: 7
