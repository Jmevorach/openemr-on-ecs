name: Monthly Version Check

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:
    inputs:
      create_issue:
        description: "Create a GitHub issue when updates are detected"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.14"
  PIP_VERSION: "26.2"

jobs:
  version-audit:
    name: Audit Dependency Versions
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install audit dependencies
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Configure report metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            title="Monthly Dependency Update Report - $(date -u '+%B %Y')"
          else
            title="On-Demand Dependency Update Report - $(date -u '+%Y-%m-%d %H:%M UTC')"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Run reusable version audit
        id: collect
        env:
          REPORT_TIMESTAMP: ${{ steps.metadata.outputs.timestamp }}
        run: |
          python -m tools.version_audit \
            --json version-check-report.json \
            --markdown version-check-summary.md \
            --timestamp "$REPORT_TIMESTAMP" \
            --fail-if-all-sources-fail
          python - <<'PYTHON'
          import json
          import os

          report = json.load(open("version-check-report.json", encoding="utf-8"))
          summary = report["summary"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"updates_found={str(summary['updates_found']).lower()}\n")
              output.write(f"partial_failure={str(summary['partial_failure']).lower()}\n")
              output.write(
                  f"action_required={str(summary['updates_found'] or summary['partial_failure']).lower()}\n"
              )
              output.write(f"finding_count={summary['total']}\n")
          PYTHON

      - name: Upload version report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: version-check-${{ github.run_id }}
          path: |
            version-check-report.json
            version-check-summary.md
          retention-days: 30

      - name: Publish run summary
        run: cat version-check-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update GitHub issue
        if: steps.collect.outputs.action_required == 'true' && (github.event_name == 'schedule' || github.event.inputs.create_issue == 'true')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('version-check-summary.md', 'utf8');
            const title = `${{ steps.metadata.outputs.title }}`;
            const marker = '<!-- openemr-version-audit -->';
            const issueBody = `${marker}\n\n${body}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'version-check',
              per_page: 100
            });
            const existing = issues.find(
              issue => !issue.pull_request && (issue.body || '').includes(marker)
            );
            if (existing) {
              const issue = await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body: issueBody
              });
              core.info(`Updated issue: ${issue.data.html_url}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: issueBody,
                labels: ['dependencies', 'maintenance', 'version-check']
              });
              core.info(`Created issue: ${issue.data.html_url}`);
            }
