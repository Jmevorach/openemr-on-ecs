[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["cdk.out", "build", "dist", ".live-e2e", ".seed-manifest-ci"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, and the flake8-bandit security rules.
select = ["E", "F", "W", "I", "S"]
ignore = [
    "E501",  # line length is enforced by the formatter
    # Low-severity bandit checks, matching the previous `bandit -ll` threshold.
    "S101",  # assert
    "S105",  # hardcoded password string
    "S106",  # hardcoded password argument
    "S107",  # hardcoded password default
    "S110",  # try/except/pass
    "S112",  # try/except/continue
    "S311",  # non-cryptographic random
    "S404",  # subprocess import
    "S603",  # subprocess call without shell
    "S607",  # partial executable path
]

[tool.ruff.lint.per-file-ignores]
# Tests were never part of the security scan; they exercise subprocesses, temp files, and fake secrets.
"tests/**" = ["S"]
"tools/credential-rotation/tests/**" = ["S"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
exclude = [
    "cdk.out/",
    ".venv/",
    "build/",
    "dist/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "floci: marks tests that require a Floci AWS emulator container",
    "unit: marks tests as unit tests",
]

